*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--ink);
  background:#EFE7D8 radial-gradient(rgba(10,10,10,.13) 1.1px, transparent 1.1px) 0 0/13px 13px;
  display:flex; align-items:safe center; justify-content:center; gap:34px; min-height:100vh; overflow:auto;
  flex-wrap:wrap; padding:16px;
}
.num{font-family:'Inter','Cairo',sans-serif; font-variant-numeric:tabular-nums; direction:ltr; display:inline-block}
button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none}
/* ---------- phone ---------- */
.phone{
  position:relative; width:min(390px,calc(100% - 4px)); height:min(844px,calc(100svh - 32px)); background:var(--paper);
  border:7px solid var(--ink); border-radius:clamp(24px,10vw,44px); box-shadow:12px 12px 0 var(--ink);
  overflow:hidden; display:flex; flex-direction:column; flex:none;
}
.phone.right{display:none}
.dual .phone.right{display:flex}
body.ops .phone:not(.right){display:none}
body.ops .phone.right{display:flex}
.notch{position:absolute; top:9px; left:50%; transform:translateX(-50%); width:112px; height:25px; background:var(--ink); border-radius:20px; z-index:60}
/* ---------- app bar ---------- */
.appbar{
  height:82px; flex:none; display:flex; align-items:flex-end; gap:9px; padding:32px 15px 10px;
  border-bottom:2.5px solid var(--ink); background:var(--paper); z-index:20;
}
.appbar h1{font-size:17px; font-weight:900; margin:0; line-height:1.05; letter-spacing:-.2px}
.appbar .sub{font-size:10.5px; color:var(--mut); font-weight:800; margin-top:3px; line-height:1}
.iconbtn{
  width:34px; height:34px; border:2.5px solid var(--ink); border-radius:11px; background:#fff;
  display:grid; place-items:center; box-shadow:2.5px 2.5px 0 var(--ink); transition:transform .08s, box-shadow .08s;
}
.iconbtn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
.iconbtn svg{width:17px; height:17px}
.spacer{flex:1}
/* ---------- view ---------- */
#view{flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 16px 96px; scroll-behavior:smooth}
#view2{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 96px;scrollbar-width:none}
#view2::-webkit-scrollbar{width:0;display:none}
#view::-webkit-scrollbar{width:0}
.page>*{animation:in .3s cubic-bezier(.2,.85,.25,1) both}
.page>*:nth-child(2){animation-delay:.03s} .page>*:nth-child(3){animation-delay:.06s}
.page>*:nth-child(4){animation-delay:.09s} .page>*:nth-child(5){animation-delay:.12s}
@keyframes in{from{transform:translateY(10px)}to{transform:none}}
body.noanim .page>*{animation:none!important}
h2.sec{font-size:13px; font-weight:900; margin:19px 2px 10px; display:flex; align-items:center; gap:7px; letter-spacing:-.1px}
h2.sec .dot{width:8px; height:8px; background:var(--red); border:2px solid var(--ink); border-radius:50%}
/* ---------- cards ---------- */
.card{background:#fff; border:2.5px solid var(--ink); border-radius:20px; box-shadow:4px 4px 0 var(--ink); padding:14px}
.card.flat{box-shadow:none}
.hero{
  background:var(--ox); color:#fff; border:2.5px solid var(--ink); border-radius:22px;
  box-shadow:5px 5px 0 var(--ink); padding:16px; position:relative; overflow:hidden;
}
.hero:after{content:""; position:absolute; inset:0; background:radial-gradient(rgba(255,255,255,.14) 1.5px, transparent 1.5px) 0 0/9px 9px; pointer-events:none}
.hero h3{margin:6px 0 4px; font-size:20px; font-weight:900; line-height:1.25}
.hero p{margin:0; font-size:11.5px; opacity:.85; font-weight:700}
.sticker{
  display:inline-block; background:var(--gold); border:2px solid var(--ink); border-radius:9px;
  padding:2px 8px; font-size:10px; font-weight:900; transform:rotate(-2.5deg); box-shadow:2px 2px 0 var(--ink);
}
/* ---------- pills / chips ---------- */
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; border:2.5px solid var(--ink); border-radius:999px; padding:6px 12px; font-size:11.5px;
  font-weight:900; background:#fff; box-shadow:2px 2px 0 var(--ink); transition:transform .08s,box-shadow .08s;
}
.chip:active{transform:translate(2px,2px); box-shadow:0 0 0}
.chip.on{background:var(--ink); color:#fff}
.chip.macro{background:#FFF4D6; border-width:2px; box-shadow:none; font-size:10px; padding:3px 8px; font-weight:800; color:#7A5205}
/* ---------- buttons ---------- */
.btn{
  width:100%; border:2.5px solid var(--ink); border-radius:16px; background:var(--ink); color:#fff;
  font-weight:900; font-size:13.5px; padding:13px; box-shadow:4px 4px 0 var(--ink);
  transition:transform .08s, box-shadow .08s; display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff; color:var(--ink)}
.btn.red{background:var(--red); color:#fff}
.btn.gold{background:var(--gold); color:var(--ink)}

/* ---------- tabbar ---------- */
.tabbar{
  position:absolute; bottom:0; left:0; right:0; height:74px; background:#fff; border-top:2.5px solid var(--ink);

}
#tabbar2 .tab{position:relative}
.tbadge{position:absolute; top:3px; left:13px; min-width:15px; height:15px; border-radius:8px; background:var(--gold);
  border:1.5px solid var(--ink); font-size:8.5px; font-weight:900; display:grid; place-items:center; padding:0 3px; color:var(--ink)}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:9.5px; font-weight:900; color:#9A8F80; width:56px}
.tab svg{width:21px; height:21px}
.tab.on{color:var(--ink)}

/* ---------- fab ---------- */
.fab{
  position:absolute; bottom:86px; left:16px; width:52px; height:52px; border-radius:16px; background:var(--red);
  border:2.5px solid var(--ink); box-shadow:4px 4px 0 var(--ink); display:grid; place-items:center; z-index:35;
  transition:transform .1s, box-shadow .1s;
}

  position:absolute; top:-8px; right:-8px; min-width:20px; height:20px; border-radius:10px; background:var(--gold);
  border:2px solid var(--ink); font-size:10px; font-weight:900; display:grid; place-items:center; padding:0 4px;
}
.fab.pop{animation:pop .4s cubic-bezier(.3,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.3) rotate(-6deg)}100%{transform:scale(1)}}
.fly{position:absolute; width:26px; height:26px; border-radius:9px; background:var(--red); border:2px solid var(--ink); z-index:80; pointer-events:none}
/* ---------- v17: week preview + pause + quiz ---------- */
.pv-chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}

.pv-card{display:flex;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:9px;margin-bottom:8px}
.pv-card.off{opacity:.45}
.pv-thumb{width:52px;height:52px;flex:none;border-radius:12px;border:2px solid var(--ink);background-size:cover;background-position:center;background-color:#EFE9DC}
.pv-name{font-size:11.5px;font-weight:900}
.pv-meta{font-size:10px;color:var(--mut);font-weight:800;margin-top:2px;display:flex;gap:8px}
.pv-snack{display:flex;gap:10px;align-items:center;padding:9px 2px 0}
.calday.skipped{opacity:.4;text-decoration:line-through}
/* ---------- v18: chip pagers (hover devices) + focus mode ---------- */
.pg-wrap{position:relative}
.pg-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:28px;height:28px;border-radius:50%;
  border:2.5px solid var(--ink);background:#fff;box-shadow:2.5px 2.5px 0 var(--ink);
  display:none;place-items:center;cursor:pointer;padding:0;color:var(--ink);transition:transform .1s}

.back{position:absolute; inset:0; background:rgba(10,10,10,.45); z-index:70; opacity:0; pointer-events:none; transition:opacity .2s}

}

.toast{
  position:absolute; left:50%; bottom:96px; transform:translate(-50%,20px); background:var(--ink); color:#fff;
  font-size:11.5px; font-weight:900; padding:9px 16px; border-radius:12px; border:2px solid var(--ink);
  opacity:0; transition:all .25s; z-index:90; pointer-events:none; white-space:nowrap;
}

.split{height:1.5px; background:var(--ink); opacity:.14; margin:10px 0}

.step{display:flex; gap:11px; position:relative; padding-bottom:20px}
.step:last-child{padding-bottom:0}
.step .bul{

}
.step.done .bul{background:var(--green); color:#fff}

.step .ln{position:absolute; top:26px; bottom:0; right:12.25px; width:2.5px; background:#D8CDBA}

.step .txt span{font-size:10px; color:var(--mut); font-weight:700}
.ring{position:relative; width:52px; height:52px; flex:none}
.ring svg{transform:rotate(180deg)}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.toggle.on{background:var(--green)}

.avatar{width:52px; height:52px; border-radius:16px; background:var(--ox); color:#fff; border:2.5px solid var(--ink); box-shadow:3px 3px 0 var(--ink); display:grid; place-items:center; font-size:20px; font-weight:900}

.side{display:flex; flex-direction:column; gap:10px; align-items:flex-start; max-width:210px}

const subtotal = () => cartLines().reduce((a,l)=>a+l.eff*l.qty,0);
const discount = () => S.promo ? Math.round(subtotal()*0.10) : 0;
const delivery = () => cartLines().length ? 30 : 0;
const voucherCut = () => (S.useVoucher && S.rewards.vouchers) ? Math.min(300, subtotal()-discount()) : 0;
const total = () => subtotal() - discount() - voucherCut() + delivery();
const lines = cartLines, sub_ = subtotal, disc = discount, deliv = delivery;

/* ---------------- helpers ---------------- */
function toast(msg, el){
  mountOverlays();
  const t = document.getElementById(el||'toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1700);
}
function fly(fromEl){
  const fab = $('#fab'); if(!fromEl||!fab) return;
  const card = fromEl.closest('.card, .cartline');
  const src = card ? card.querySelector('.thumb') : null;
  const a = (src||fromEl).getBoundingClientRect(), b = fab.getBoundingClientRect(), p = $('#phone').getBoundingClientRect();
  const size = src ? 38 : 24;
  const d = document.createElement('div'); d.className='fly';
  d.style.width=d.style.height=size+'px';
  d.style.left = (a.left-p.left+a.width/2-size/2)+'px'; d.style.top = (a.top-p.top+a.height/2-size/2)+'px';
  if(src){ d.style.borderRadius='11px'; d.style.background = getComputedStyle(src).backgroundImage+' center/cover'; }
  $('#phone').appendChild(d);
  const dx=b.left-a.left, dy=b.top-a.top;
  d.animate([
    {transform:'translate(0,0) scale(1) rotate(0deg)', opacity:1},
    {transform:`translate(${dx*.55}px,${dy*.72-72}px) scale(.85) rotate(-9deg)`, opacity:1, offset:.55},
    {transform:`translate(${dx}px,${dy}px) scale(.3) rotate(7deg)`, opacity:.15}
  ], {duration:650, easing:'cubic-bezier(.45,.05,.55,.95)'}).onfinish = () => d.remove();
}
function pop(){ const f=$('#fab'); f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop'); }

/* ---------------- v18: chip pagers + focus mode ---------------- */
function pagerChips(){ if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  /* RTL magnitude: Chrome scrollLeft 0→negative, Safari positive→0 — normalize both */
  const mag=row=>{ const max=row.scrollWidth-row.clientWidth; if(max<=4) return [0,0];
    const sl=row.scrollLeft; const m=sl<=0?-sl:Math.max(0,max-sl); return [m,max]; };
  const chevR='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5l7 7-7 7"/></svg>';
  const chevL='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg>';
  /* eased tween — deterministic end state even if rAF throttles (timeout guard) */
  const tween=(row,to,sync)=>{ const from=row.scrollLeft, t0=performance.now(), dur=340;
    const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      row.scrollLeft=from+(to-from)*e;
      if(k<1) requestAnimationFrame(step); else sync(row); };
    requestAnimationFrame(step); setTimeout(()=>{ row.scrollLeft=to; sync(row); },dur+80); };
  document.querySelectorAll('#view .chips, #view .pv-chips').forEach(row=>{
    const sync=()=>{ const [m,max]=mag(row);
      const l=row.parentNode.querySelector('.pg-arrow-l'), r=row.parentNode.querySelector('.pg-arrow-r');
      if(l) l.classList.toggle('pg-off',m>=max-4);
      if(r) r.classList.toggle('pg-off',m<=4); };
    if(!row.dataset.pg){ row.dataset.pg='1';
      const wrap=document.createElement('div'); wrap.className='pg-wrap';
      row.parentNode.insertBefore(wrap,row); wrap.appendChild(row);
      /* ‹ sits left, goes deeper into RTL overflow; › sits right, returns to start */
      [['pg-arrow-l',chevL,-1],['pg-arrow-r',chevR,1]].forEach(([cls,svg,dir])=>{
        const b=document.createElement('button'); b.type='button'; b.className='pg-arrow '+cls;
        b.setAttribute('aria-label',dir<0?'المزيد':'رجوع'); b.innerHTML=svg;
        b.onclick=e=>{ e.stopPropagation();
          const [m,max]=mag(row), sl=row.scrollLeft;
          const m2=dir<0?Math.min(max,m+240):Math.max(0,m-240);
          tween(row, sl<=0 ? -m2 : max-m2); };
        wrap.appendChild(b); });
      row.addEventListener('scroll',()=>sync(),{passive:true}); }
    sync(); }); }
window.pgSyncAll=()=>document.querySelectorAll('#view .pg-wrap .chips, #view .pg-wrap .pv-chips').forEach(r=>{ const e=new Event('scroll'); r.dispatchEvent(e); });
let __fcResize=null;
function focusMode(on){ const bd=document.body;
  const ph=document.getElementById('phone');
  if(on){ bd.classList.add('focus');
    const fit=()=>{ if(!bd.classList.contains('focus')) return;
      ph.style.transform=`scale(${Math.min(1.25,(window.innerHeight-56)/844)})`; };
    fit(); __fcResize=fit; window.addEventListener('resize',fit);
    let pill=document.getElementById('fc-pill');
    if(!pill){ pill=document.createElement('button'); pill.id='fc-pill'; pill.textContent='خروج ✕';
      pill.onclick=()=>{ focusMode(false); try{webMode(false);}catch(e){} }; document.body.appendChild(pill); }
    pill.style.display='inline-flex';
  } else { bd.classList.remove('focus'); ph.style.transform='';
    const pill=document.getElementById('fc-pill'); if(pill) pill.style.display='none';
    if(__fcResize){ window.removeEventListener('resize',__fcResize); __fcResize=null; } } }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(document.body.classList.contains('focus')||document.body.classList.contains('web'))){ focusMode(false); webMode(false); } });
/* height sense: shrink the phone to fit short viewports — margin compensation kills the dead space transforms leave behind */
function fitH(){ const bd=document.body;
  if(bd.classList.contains('focus')||bd.classList.contains('web')||bd.classList.contains('ops')) return;
  const ph=document.getElementById('phone'); if(!ph) return;
  const H=ph.offsetHeight||844, s=Math.min(1,(window.innerHeight-64)/H);
  if(s<1){ ph.style.transform=`scale(${s})`; ph.style.transformOrigin='top center'; ph.style.marginBottom=(-H*(1-s))+'px'; }
  else { ph.style.transform=''; ph.style.marginBottom=''; } }
window.addEventListener('resize',fitH);
/* web mode: same app, wide canvas — the embeddable website story */
function webMode(on){ const bd=document.body;
  bd.classList.toggle('web',!!on);
  let pill=document.getElementById('fc-pill');
  if(on){ if(!pill){ pill=document.createElement('button'); pill.id='fc-pill'; document.body.appendChild(pill); }
    pill.textContent='خروج ✕'; pill.onclick=()=>{ focusMode(false); webMode(false); }; pill.style.display='inline-flex'; }
  else if(!bd.classList.contains('focus')&&pill){ pill.style.display='none'; } }

        <div class="row sb"><div class="row" style="gap:7px">${ic('pin',14)}<b style="font-size:11.5px">${b.n}</b></div>${S.branch===i?`<span style="color:#155F30">${ic('check',15)}</span>`:''}</div>
        <div class="muted" style="margin-top:2px">${b.d}</div></div>`).join('')}
      <button class="btn ghost" style="margin-top:6px" data-act="closeSheet">إلغاء</button>`); },
  setBranch(i){ S.branch=+i; closeSheet(); rerender(); toast('الفرع اتغيّر'); },
  redeemMeal(id){ if(!S.rewards.meals) return toast('مفيش تذاكر متاحة');
    S.rewards.meals--; S.cart[id]=(S.cart[id]||0)+1; S.free[id]=1; syncBadge(); save();
    closeSheet(); cartSheet(); toast('وجبة مجانية بالتذكرة'); },
  addrSheet(){ sheet(`<b style="font-size:12.5px">عنوان جديد</b>
      <div class="card flat" style="margin-top:9px;padding:11px">
        <div class="muted tiny">الاسم</div>
        <input id="a_n" value="عنوان" style="width:100%;border:none;border-bottom:2px solid #0B0B0B;background:none;font-family:inherit;font-weight:900;font-size:12px;padding:5px 0;outline:none">
        <div class="muted tiny" style="margin-top:9px">التفاصيل</div>
        <input id="a_d" placeholder="المنطقة — الشارع — رقم" style="width:100%;border:none;border-bottom:2px solid #0B0B0B;background:none;font-family:inherit;font-weight:800;font-size:11.5px;padding:5px 0;outline:none">
      </div>
      <button class="btn" style="margin-top:10px" data-act="saveAddr">حفظ العنوان</button>
      <button class="btn ghost" style="margin-top:7px" data-act="closeSheet">إلغاء</button>`); },
  saveAddr(){ const n=($('#a_n').value||'عنوان').trim(), d=($('#a_d').value||'').trim();
    if(!d) return toast('اكتب تفاصيل العنوان');
    S.addrs.push({t:n,d}); S.addr=S.addrs.length-1; closeSheet(); rerender(); toast('العنوان اتضاف'); },
  editName(){ sheet(`<b style="font-size:12.5px">اسمك</b>
      <input id="u_n" value="${S.user.name}" style="width:100%;margin-top:9px;border:2.5px solid #0B0B0B;border-radius:12px;background:#fff;font-family:inherit;font-weight:900;font-size:13px;padding:10px;outline:none">
      <button class="btn" style="margin-top:9px" data-act="saveName">حفظ</button>
      <button class="btn ghost" style="margin-top:7px" data-act="closeSheet">إلغاء</button>`); },
  saveName(){ S.user.name=($('#u_n').value||S.user.name).trim(); closeSheet(); rerender(); },
  goalInc(){ S.goal+=10; rerender(); },
  goalDec(){ S.goal=Math.max(40,S.goal-10); rerender(); },
  riderSheet(){ sheet(`<b style="font-size:12.5px">المندوب</b>
      <div class="card flat" style="margin-top:9px"><div class="row">
        <div class="avatar" style="background:var(--gold);color:var(--ink)">${ic('phone',18)}</div>
        <div style="flex:1"><b style="font-size:11.5px">كريم</b><div class="muted">دراجة · فرع الشيخ زايد</div></div>
        <span class="macro g">4.9 ★</span></div></div>
      <button class="btn" style="margin-top:9px" data-act="fakeCall">${ic('phone',14)} اتصال</button>
      <button class="btn ghost" style="margin-top:7px" data-act="closeSheet">رجوع</button>`); },
  fakeCall(){ toast('اتصال تجريبي — مفيش مكالمة حقيقية'); },
  orderSheet(no){ const o=S.orders.find(x=>x.no==no); if(!o)return;
    sheet(`<div class="row sb"><b style="font-size:12.5px">طلب #${o.no}</b>
        <span class="macro ${o.status===3?'g':''}">${o.status===3?'تم التوصيل':'جاري'}</span></div>
      <div class="muted" style="margin:5px 0 9px">${o.addr} · ${o.slot}</div>
      ${o.items.map(i=>`<div class="kv"><span>${i.ar} × ${i.qty}</span><b class="num">${money(i.price*i.qty)}</b></div>`).join('')}
      <div class="split"></div><div class="kv total"><span>الإجمالي</span><b class="num">${money(o.total)}</b></div>
      <button class="btn red" style="margin-top:10px" data-act="reorder" data-v="${o.no}">${ic('swap',13)} إعادة الطلب</button>
      <button class="btn ghost" style="margin-top:7px" data-act="closeSheet">رجوع</button>`); },
  closeSheet,
  mode(){ const b=document.body, on=!b.classList.contains('ops');
    b.classList.remove('dual'); b.classList.toggle('ops', on); closeSheet();
    $('#modeBtn').textContent = on ? 'وضع التطبيق (العميل)' : 'لوحة التحكم';
    window.adminDirty=false; if($('#view2')) $('#view2').innerHTML=V2();chrome2(); },
  reset(){ localStorage.removeItem(KEY); S=JSON.parse(JSON.stringify(DEF)); render(); toast('اتصفرت البيانات'); }
};

/* tracking simulation */
let trackTimer=null;
const TRACK_STEPS=['تم استلام الطلب','في المطبخ','مع المندوب','تم التوصيل'];
function tickTrack(o){
  const hEl=$('#homeEta'); if(hEl) hEl.textContent=o.eta;
  if(S.screen!=='track') return;
  const e=$('#etaBox'); if(e) e.textContent=o.eta;
  const t=$('#trackState'); if(t) t.textContent=TRACK_STEPS[Math.min(o.status,3)];
  const sb=$('#trackSub'); if(sb) sb.textContent=o.status<3?'المندوب في الطريق إليك':'وصل — بالهنا والشفا';
  document.querySelectorAll('#view .step').forEach(el=>{
    const i=+el.dataset.i;
    el.classList.toggle('done',i<o.status); el.classList.toggle('now',i===o.status);
    const b=el.querySelector('.bul'); if(b) b.textContent = i<o.status?'✓':(i+1);
    const s=el.querySelector('.txt span'); if(s) s.textContent = i<o.status?'تم':(i===o.status?'دلوقتي':'…');
  });
}

function startTrack(no){
  clearInterval(trackTimer);
  let t=25*60;
  trackTimer=setInterval(()=>{
    const o=S.orders.find(x=>x.no==no); if(!o) return clearInterval(trackTimer);
    t--; o.eta=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
    if(t%45===0 && o.status<3) o.status++;  // slow demo drift — the admin console is the real driver
    tickTrack(o);
    if(o.status>=3){ clearInterval(trackTimer); }
  },1000);
}

/* ---------------- boot ---------------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=ACT[el.dataset.act]; if(fn) { e.stopPropagation(); fn(el.dataset.v, el); }
});
document.addEventListener('keydown', e=>{ if(e.key==='h'||e.key==='H') document.body.classList.toggle('clean'); });
render();
try{ fitH(); }catch(e){}
if(S.orders.length && S.orders[0].status<3) startTrack(S.orders[0].no);

/* driver API so a film stage can script the app from the parent frame */
window.__drive = {
  tab:v=>ACT.tab(v), go:v=>ACT.go(v), item:id=>ACT.item(id), add:id=>ACT.add(id,null),
  addFromSheet:id=>ACT.addFromSheet(id), close:()=>ACT.closeSheet(),
  state:()=>({screen:S.screen, cart:cartCount(), total:total()})
};
</script>
