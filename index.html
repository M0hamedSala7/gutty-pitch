<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUTTY — من غير وسيط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#FAF6EC; --ink:#141210; --oxblood:#6B1F1F; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--cream); color:var(--ink);
        font-family:'Cairo',system-ui,Tahoma,sans-serif; line-height:1.9; }
  .wrap{ max-width:760px; margin:0 auto; padding:40px 20px 80px; text-align:center; }
  h1{ font-weight:900; font-size:clamp(28px,6vw,44px); line-height:1.5; margin-bottom:28px; }
  .card{ background:#fff; border:3px solid var(--ink); border-radius:20px;
         box-shadow:12px 12px 0 var(--ink); overflow:hidden; margin-bottom:28px; }
  .cta{ display:block; background:#fff; color:var(--oxblood); text-decoration:none;
        font-weight:900; font-size:22px; padding:18px; border-radius:16px;
        border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink);
        margin:12px 0; transition:transform .12s ease; }
  .cta:active{ transform:translate(4px,4px); box-shadow:4px 4px 0 var(--ink); }
  .line{ font-size:18px; font-weight:700; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Gutty — من غير وسيط.</h1>

  <div class="card">
    <video id="filmVideo" controls preload="metadata" poster="poster.jpg"
      src="gutty_story_full_720p.mp4" style="width:100%;display:block"></video>
  </div>

  <a class="cta" id="demoBtn" href="app.html">الديمو — شغال على منيو Gutty</a>

  <p class="line">عايزه شغال عندك؟ رد على الرسالة.</p>

</div>
<script defer src="https://cloud.umami.is/script.js" data-website-id="2dc7b546-afc0-4735-a315-893335892bf4"></script>
<script>
(function(){
  var to = (new URLSearchParams(location.search)).get('to') || 'direct';
  function track(name){ try{ if(window.umami) umami.track(name, { to: to }); }catch(e){} }
  var demo = document.getElementById('demoBtn');
  if(demo) demo.addEventListener('click', function(){ track('demo_click'); });
  function wireVideo(){
    var v = document.getElementById('filmVideo');
    if(!v || v._wired) return; v._wired = true;
    var half = false;
    v.addEventListener('play', function(){ track('film_play'); });
    v.addEventListener('timeupdate', function(){
      if(!half && v.duration && v.currentTime / v.duration >= 0.5){ half = true; track('film_half'); }
    });
    v.addEventListener('ended', function(){ track('film_done'); });
  }
  wireVideo(); setInterval(wireVideo, 2000);
})();
</script>
</body>
</html>
